<main class="board" lang="ja" data-board-id="broken-j" data-answer-title="J の反証">
  <h1>J の反証</h1>
  <div class="card answer-choice" role="button" tabindex="0" aria-pressed="false"
       data-q="approval" data-value="approve">
    <h4>data-label だけが無い選択肢</h4>
  </div>
  <section class="answer-set" data-q="approval" data-title="承認するか">
    <textarea class="answer-note" data-q="approval" aria-label="判断の補足"></textarea>
