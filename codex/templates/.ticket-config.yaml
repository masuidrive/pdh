# Ticket system configuration
# https://github.com/masuidrive/ticket.sh

# Directory settings
tickets_dir: "tickets"

# Git settings
default_branch: "main"
branch_prefix: "features/"
repository: "origin"

# Automatically push changes to remote repository during close command
auto_push: true

# Automatically delete remote feature branch after closing ticket
delete_remote_on_close: true

# note と ticket の checkbox が全部片付くまで close を拒否する。
# `--force` では抜けられない。当てはまらない項目は `- [-] ... - skip: <理由>` と
# 書いて理由をファイルに残す（理由なしの `- [-]` は未了として扱われる）。
# 未了の一覧は `./ticket.sh check` で見る。特定の節だけを要求するときは
# `./ticket.sh check --require "<見出し名>"`。
require_checklist: true
pre_close_command: "bash scripts/check-pdh-ticket.sh"

# 上の gate は「未了の checkbox を数える」ので、節ごと消えた ticket では 0 件 = 全部
# 片付いた、と読めてしまう。ここに宣言した見出しは、無ければ close を拒否する
# （見出しだけあって checkbox が 0 個の場合も同じ）。`require_checklist` とは独立に
# 効き、`--force` では抜けられない。ticket.sh 20260830 以降が必要。
require_checklist_groups:
  - "Required-Probes"
  - "Checklist"

# ticket dir に note.md 以外の付属ファイルを作る（ticket.sh 20260914 以降）。
# progress.md は経緯（何をして、何が起き、何を決めたか）の追記だけの記録。現在値は note.md。
ticket_files:
  - path: progress.md
    content: |
      # Progress: $$TICKET_NAME$$

# 一度書いた行を消す・書き換えると close が拒否するファイル（ticket.sh 20260914 以降）。
append_only_files:
  - progress.md

# Worktree settings
# `ticket.sh start --worktree` が worktree を作成・再開したとき、main repo から
# コピーする gitignored ファイル（repo root 相対）。既存ファイルは上書きせず、
# source が無ければ warning のみで続行する。一時的な追加は
# `./ticket.sh start --worktree --copy-file <path>`（繰り返し可）。
# worktree での実行に必要な gitignored ファイルをプロジェクトに合わせて列挙する。
worktree_mode: true
worktree_copy_files:
  - .env

# Success messages
new_success_message: |
  Ticket を作成しました。`/pdh-pm` の PDH-ticket-write（skill `pdh-ticket-write`）で ticket を埋めてから、`./ticket.sh start` で PDH-open へ進んでください。

start_success_message: |
  Ticket を開きました。新しく始めた ticket は `/pdh-pm` の PDH-open（skill `pdh-open`）から PDH-ticket-review へ進みます。作業が中断している ticket を再開するときは skill `pdh-resume` に従い、note の Status の PDH-stage から続けてください。

restore_success_message: |

close_success_message: |
  Ticket をクローズしました。

# Note template — 作業記録用。プロセス通過の証跡はセクション構造が担う
note_content: |
  # Note: $$TICKET_NAME$$

  ## Status: PDH-ticket-write

  ## Checklist
  <!-- PDH-stage を移るたびにこの節を見る。節を PDH-stage ごとに割らない —
       割ると「その PDH-stage の分だけ」を見て、他が残っていることに気づかない。
       ユーザに頼まれたことと、作業中に見つけた «あとでやる» もここへ足す
       （着手より先に書く。規則は PDH-AGENTS.md「頼まれたことを Checklist に書く」）。
       当てはまらない項目は `- [-] ... - skip: <理由>` と書いて理由を残す（理由なしの `- [-]` は未了扱い）。
       未了の一覧は `./ticket.sh check`。
       PDH-stage のチェックリスト（`- [ ] PDH-…:` の行）は、その PDH-stage に入るときに
       `bash scripts/pdh-stage-checklist.sh <PDH-stage> --enter <この note>` が skill から写す。ここに手で書かない。 -->

  ## PDH-ticket-review. Ticket contract check
  <!-- PDH-ticket-review で確かめた結果を書く（skill pdh-ticket-review「確かめた結果と、変えたことを書く」）。
       Product Brief の目的・ジャーニー・Architectural-Invariants との突き合わせ、Dependencies、
       残した Open-Questions と残した理由、AC が触る consumer surface の一覧。
       下の 5 行はコストと利益（skill pdh-ticket-review「コストと利益を確かめる」）。値を書くまで出力の確認が通らない。
       この PDH-stage で変えたことと理由は progress に書く。 -->
  Feasibility:
  DB-changes:
  API-changes:
  Complexity:
  Benefit:

  ## Required-Probes
  <!-- AC ごとに「達成できると確かめたか」を判定し、確かめていなければ確かめる手段をここへ書く。
       PDH-ticket-review の中で実行し、実行した command と output を progress に書いてから、ここの行を [x] にする。
       実行できないもの（実装しないと分からないこと）は、AC に結果を書かず
       「測って記録する＋この値を下回ったら止めて報告する」の形にする。
       この節は close の必須グループ（`require_checklist_groups`）なので、消すと close が止まる。
       途中で要求するときは `./ticket.sh check --require "Required-Probes"`。 -->
  - [ ] 測る対象を洗い出し、測れるものは測って結果を progress に書いた（測る対象が無いなら `- [-] ... - skip: <理由>`）

  ## Open-Questions
  <!-- ticket を書くときに決まらなかったことと、実装中の «後から戻せて、ticket の約束を変えない選択»・採用した default 値を、
       見つけた時点で 1 件 1 行の `- [ ]` で append する（運用は pdh-ticket-write「未決の事項を note に書く」と
       .codex/agents/pdh-coding-engineer.toml「Open-Questions」に従う）。決まったら `[x]` にし、決まった内容を同じ行に書く。
       close は未了の checkbox を数えるので、決まっていない行が残ると close できない。 -->

# Ticket template — pdh-ticket-write SKILL の ticket 標準構造に準拠
# このテンプレートには frontmatter が含まれていない。
# YAML frontmatter (created_at, started_at, closed_at) は ticket.sh が自動挿入する。
#
# Acceptance Criteria にはプロダクトの観察可能な振る舞いだけを書く。
# プロセス要件 (レビュー済み、テストパス等) は SKILL.md のワークフローが保証し、
# note のセクション構造が通過証跡になるので、ticket の Acceptance Criteria には書かない。
default_content: |
  ## $$TICKET_NAME$$

  ### Why
  <!-- ユーザ価値・解きたい問題を 1〜3 行で書く。
       Product Brief の Problem / Solution のどの部分を担うか明記する。 -->
  Key-User-Journeys: <!-- この ticket が良くする Product Brief の Key User Journeys の番号（例: J3）。1 つ以上。どれにも当たらない（内部の整理など）なら «該当なし» と理由 -->
  Reproduction-or-measurement: <!-- 何を開いて・何を実行して・何が見えたか。バグなら再現手順と結果。要望なら原文の所在と、現状を 1 回確かめた結果 -->
  Why-not-fix-now: <!-- 進行中の ticket から派生したなら、別の問題であり、かつそこで直すと高くつく理由。要望起点なら «該当なし（要望起点。進行中の ticket から派生していない）» -->

  ### What / Acceptance Criteria
  <!-- 完了を判定できる条件。プロダクトの観察可能な振る舞いだけを書く。
       読み手はこの ticket を承認する人であり、実装する agent ではない。

       箇条書きを書き始める前に、この節の冒頭へ 1 文を書く:
         「この ticket が終わると、〈誰〉が、いままでできなかった〈何〉をできるようになる」
       各 AC はその 1 文の分割として書く。今できることが変わらないことを確かめる AC だけは例外で、〈誰〉のみ必須。
       読めているかの判定は skill `pdh-ticket-write`「AC の書き方」に従う。

       例: 「新しく登録したユーザが、一覧の画面に出る」
       例: 「画面幅 375px 以下でメニューがハンバーガーに切り替わる」

       プロセス要件 (レビュー済み、テストパス等) はここには書かない。
       PDH の skill と note が保証する。

       runtime で UX/Security invariant を強制する ticket では、AC に「runtime enforce の
       保証メカニズム」を 1 行明記する (例: editor 警告だけでなく 422 reject されること)。 -->
  - [ ] AC 1: ...
  - [ ] AC 2: ...
  AC-approved: <!-- PDH-ticket-human-review で AC と Out-of-scope の承認を得たら、`bash scripts/check-pdh-ticket.sh --ac-hash <ticket.md>` の値を書く。
       値は AC と Out-of-scope の文のハッシュで、どちらかを書き換えると合わなくなり、check-pdh-ticket.sh が再承認を求める。
       checkbox の印・空白・改行の違いは数えない。 -->

  ### Architectural-Invariants-check
  <!-- product-brief.md の Architectural-Invariants と矛盾しないことを 1 行宣言する。
       矛盾しない場合: 「既存の Architectural-Invariants と矛盾しない」等。
       新規 Invariant を要求する場合: 実装を止めて Product Brief 更新から始める。 -->

  ### Design-Decisions
  <!-- 決めてある作り方の判断と理由を箇条書きで明示。
       例: - データ保存形式: data URI (Files API は将来 ticket、本 ticket では不要)
       例: - 423 reject ではなく 422: validation error として扱う -->
  -
  - 影響（無ければ「なし」と書く）:
    - DB schema / persisted data model:
    - Public API / external contract:
    - CLI / SDK / file format / event schema:
    - Backward compatibility:
    - Migration / rollout / rollback:
    - Docs / generated artifacts:

  ### Out-of-scope
  <!-- やらないこと (scope creep 防止)。
       「ついでにやりそう」「次の ticket でやる」を明記する。 -->
  -

  ▼ 以下は該当する情報がある場合のみ ▼

  ### Implementation Notes
  <!-- ユーザの明示指示、またはユーザが会話で言及した事項のみ書く (関数名 / module 名レベルまで)。
       作り方の判断は「Design-Decisions」に書く。
       Coding Engineer は Implementation Notes が空でも実装できる責務を持つ。
       PM が自主的に実装詳細を書いてはならない (Coding Engineer の自由度を奪う)。 -->

  ### Dependencies
  <!-- この ticket に着手するために完了が必要な他の ticket。
       「参考情報」ではなく「ブロッカー」だけ書く。なければ省略。
       ブロッカー = これが未完了だと実装・テストが物理的にできない依存。
       例: 「DB migration の ticket が先に必要」「認証 API が存在しないと結合できない」
       参考情報 (設計の参考にした ticket 等) は書かない。
       coding agent は未完了の依存がある場合、着手せず報告する。 -->

  ---
  Note: `$$NOTE_PATH$$`

# Based on https://github.com/masuidrive/pdh/blob/XXXXXXX/codex/templates/.ticket-config.yaml
