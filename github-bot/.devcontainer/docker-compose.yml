name: coding-bot

services:
  app:
    container_name: coding-bot-app
    # ⚠ compose 構成では、devcontainers/ci の cacheFrom だけでは層が再利用されない。
    # 実際に効くのはここの image: / cache_from: である。CI では DEVCONTAINER_IMAGE に
    # 事前ビルド済みの ref が入り、pull 済みの層をそのまま使う。ローカルでは未設定なので
    # 下のローカル tag へ落ちる。
    image: ${DEVCONTAINER_IMAGE:-coding-bot-devcontainer:local}
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        CLI_REFRESH: ${CODING_BOT_CLI_REFRESH:-}
      cache_from:
        - ${DEVCONTAINER_IMAGE:-coding-bot-devcontainer:local}
    volumes:
      - ..:/workspaces/${LOCAL_WORKSPACE_FOLDER_BASENAME:-project}:cached
    environment:
      WORKSPACE_FOLDER: /workspaces/${LOCAL_WORKSPACE_FOLDER_BASENAME:-project}
    working_dir: /workspaces/${LOCAL_WORKSPACE_FOLDER_BASENAME:-project}
    command: sleep infinity
