name: Coding Robot — Finalize Ticket

# pr-merge は merge を close 承認とし、API で Issue と stage ラベルを更新する。
# merge / pr の Issue close は bot の次の run に任せる。
# checkout・repo のコード実行・default branch への push は行わない。
# done への移動は PR 作成後、ready にする前にその PR の差分へ載せる。

on:
  pull_request:
    types: [closed]

jobs:
  finalize:
    # merge された agent/issue-* の PR だけに反応する（merge せず閉じた場合は D6 の扱い）
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'agent/issue-')
    runs-on: ubuntu-latest
    permissions:
      # ticket と設定を contents API で読むため contents: read も必要。
      issues: write
      pull-requests: read
      contents: read
    outputs:
      # 下の delete-branch job が読む。ticket が done/ へ入っていない PR の branch は消さない
      # — そのときの直し方が «branch 上で close をやり直す» だからである（下のコメント参照）。
      landed: ${{ steps.check.outputs.landed }}

    steps:
      - name: Close the issue if the ticket actually landed
        id: check
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # head ref 'agent/issue-<N>' から Issue 番号を取り出す
          ISSUE_NUMBER="${HEAD_REF##*issue-}"
          if ! printf '%s' "$ISSUE_NUMBER" | grep -qE '^[0-9]+$'; then
            echo "Could not parse issue number from head ref '$HEAD_REF'; skipping."
            exit 0
          fi
          echo "Issue #$ISSUE_NUMBER (head: $HEAD_REF, PR: #$PR_NUMBER)"

          # ⚠ ここは «実行» ではなく «検査» である。ticket を done/ へ移すのは PR の仕事で、
          # この job はそれが本当に入っていたかだけを見る。入っていなければ Issue を閉じない
          # — 閉じてしまうと «Issue は完了なのに ticket は未処理» という、いちばん見つけにくい
          # 食い違いが残る。開いたままなら reconcile でも人の目でも拾える。
          FILES=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' || true)

          # 名指しされた ticket は名前に issue 番号を含まないため frontmatter も読む。
          LANDED=no
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            body=$(gh api "repos/$REPO/contents/${f}?ref=${MERGE_SHA}" \
                     -H 'Accept: application/vnd.github.raw' 2>/dev/null || true)
            if printf '%s' "$body" | grep -qE "^branch: ${HEAD_REF}$"; then
              echo "matched via branch: $f"; LANDED=yes; break
            fi
            if printf '%s' "$body" | grep -qE "^issue: ${ISSUE_NUMBER}$"; then
              echo "matched via issue: $f"; LANDED=yes; break
            fi
          done <<< "$(printf '%s\n' "$FILES" | grep -E '^tickets/done/.*/ticket\.md$' || true)"

          # ⚠ 旧判定を OR で残す。frontmatter が読めない場合（MERGE_SHA が空・API 失敗）に
          # «閉じない» へ倒れるのを防ぐためで、これがあれば新しい判定の追加で退行しない。
          if [ "$LANDED" = no ] \
             && printf '%s\n' "$FILES" | grep -qE "^tickets/done/.*-issue-${ISSUE_NUMBER}/ticket\.md$"; then
            echo "matched via directory name"
            LANDED=yes
          fi
          echo "ticket landed in tickets/done/: $LANDED"
          echo "landed=$LANDED" >> "$GITHUB_OUTPUT"

          # merge 時点の設定を読む。取得失敗では Issue を閉じない。
          config=$(gh api "repos/$REPO/contents/.ticket-config.yaml?ref=${MERGE_SHA}" \
                     -H 'Accept: application/vnd.github.raw') || {
            echo "Could not read github_bot.close; leaving the Issue open." >&2
            exit 1
          }
          # snippet と同じ block mapping を読む（引用符と行末コメントを許可）。
          CLOSE_MODE=$(printf '%s\n' "$config" | awk '
            /^github_bot:[[:space:]]*(#.*)?$/ { section=1; next }
            section && /^[^[:space:]#]/ { section=0 }
            section && /^  close:/ {
              sub(/^  close:[[:space:]]*/, ""); sub(/[[:space:]]+#.*/, "")
              gsub(/[\047\042[:space:]]/, ""); print; exit
            }')
          CLOSE_MODE="${CLOSE_MODE:-merge}"
          case "$CLOSE_MODE" in
            pr-merge) ;; # 人の merge が承認。以下で Issue を閉じる。
            pr) echo "github_bot.close=pr: merge 済み。次の 🤖 で Issue を閉じます。"; exit 0 ;;
            merge) echo "github_bot.close=merge: Issue close は ticket.sh close 後の bot に任せます。"; exit 0 ;;
            *) echo "Unknown github_bot.close: $CLOSE_MODE; leaving the Issue open." >&2; exit 1 ;;
          esac

          STATE=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json state -q .state || echo UNKNOWN)
          if [ "$STATE" != OPEN ]; then
            echo "Issue #$ISSUE_NUMBER is already closed ($STATE); nothing to do."
            exit 0
          fi

          if [ "$LANDED" = no ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "$(printf 'PR #%s が merge されましたが、**この PR に ticket の `tickets/done/` への移動が入っていません。**\n\nそのため Issue を閉じていません。ticket は `tickets/` に残ったままです。\n\n直し方: branch 上で `bash ticket.sh close --no-merge --no-push <ticket 名>` を実行して commit を作り、その差分を default branch へ入れてください。' "$PR_NUMBER")" || true
            echo "Ticket did not land; issue left open on purpose."
            exit 0
          fi

          if gh issue close "$ISSUE_NUMBER" --repo "$REPO" --reason completed \
            --comment "PR #${PR_NUMBER} が merge されました。merge が close 承認です（\`github_bot.close: pr-merge\`）。ticket の \`tickets/done/\` への移動と \`closed_at\` は、この PR の差分に含まれています。"; then
            # 閉じた Issue の待ち印を外し、到達 stage を PDH-close にする。
            stale=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json labels -q '.labels[].name' \
              | grep -E '^PDH-|^awaiting-reply$' | grep -vx 'PDH-close' || true)
            rm_args=()
            for l in $stale; do rm_args+=(--remove-label "$l"); done
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label PDH-close \
              ${rm_args[@]+"${rm_args[@]}"} >/dev/null 2>&1 \
              && echo "stage ラベルを PDH-close へ付け替えた（外した: ${stale:-なし}）" \
              || echo "Warning: failed to swap the stage label"
          else
            echo "Warning: gh issue close failed; issue stays open."
          fi

  # merge された agent/issue-<N> の head branch を消す。
  #
  # ⚠ **消してよいのはここだけである。**`github_bot.close: merge` では bot 自身が
  # `ticket.sh close --no-delete-remote` で squash merge するが、**その run はまだ終わっていない。**
  # `run-action.sh` は engine が止まったあとにも `HEAD:$BRANCH_NAME` へ push する経路を持つ
  # （画像の後始末・待ち行の反映）ので、そこで branch を消しても **その push が作り直す。**
  # 残るのは «PR を持たず default branch にも無い commit を載せた branch» — つまり消したせいで
  # 置き去りの branch を作ることになる。この job は run の外（人が merge した後）で走るため、
  # 作り直すものが無い。
  #
  # ⚠ **repo 設定 `delete_branch_on_merge` は使わない。**あれは人が手で作った PR の branch にも
  # 一律で効くので、導入先に副作用が出る。ここで head ref を名指しすれば副作用は生じない。
  #
  # ⚠ **merge されずに閉じた PR の branch は消さない**（`merged == true` でしか走らない）。
  # その作業は branch にしか無いためである。
  # ⚠ **ticket が `tickets/done/` へ入っていない PR の branch も消さない**（`landed` を見る）。
  # 上の job が案内する直し方が «その branch 上で close をやり直す» なので、消すと直せなくなる。
  delete-branch:
    needs: finalize
    if: needs.finalize.outputs.landed == 'yes'
    runs-on: ubuntu-latest
    permissions:
      # ⚠ ref を消すのに contents: write が要る。⚠ この job は checkout せず repo のコードを
      # 1 行も実行しないので、bot が PR に混ぜたコードがこの権限で走る経路は無い。
      contents: write

    steps:
      - name: Delete the merged agent branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api -X DELETE "repos/$REPO/git/refs/heads/$HEAD_REF" --silent 2>/dev/null; then
            echo "Deleted branch $HEAD_REF"
          else
            echo "Branch $HEAD_REF was not deleted (already gone, or protected); leaving it as is."
          fi
