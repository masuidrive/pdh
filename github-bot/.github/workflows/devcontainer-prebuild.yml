name: Devcontainer Prebuild

# coding-robot が使う devcontainer image を先に焼いて GHCR へ置く。
#
# ⚠ **なぜ要るのか。**coding-robot は毎 run で devcontainer をビルドする。軽い image なら
# 数分で済むが、repo の開発環境（apt・言語処理系のソースビルド・ブラウザの焼き込み）が
# 入ると 10 分を超え、run の大半がビルドになる。⚠ **重い層は `.devcontainer/**` が
# 変わったときしか変わらない**ので、ここで 1 回焼いて coding-robot は pull するだけにする。
#
# ⚠ **compose 構成では devcontainers/ci の cacheFrom は効かない。**実際に層を再利用させて
# いるのは docker-compose.yml の `image:` と `cache_from:` である（この 2 つが無いと、
# 事前ビルドしても coding-robot 側は作り直す）。
#
# ⚠ **この workflow は任意である。**入れなくても coding-robot は動く（毎 run ビルドする）。
# 入れる基準は «devcontainer が重いか» で、目安は 1 run のビルドが 5 分を超えるとき。

on:
  push:
  workflow_dispatch:
  # 上流の浮動インストール（CLI の最新版など）が古びすぎないよう、週 1 で焼き直す。
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC

# 同じ :latest を取り合わない
concurrency:
  group: devcontainer-prebuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prebuild:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

        with:
          fetch-depth: 0

      - name: Select changed image inputs
        id: inputs
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          IMAGE_PATHS: ${{ vars.CODING_ROBOT_PREBUILD_PATHS || '.devcontainer/** .github/workflows/devcontainer-prebuild.yml .github/coding-robot/smoke-local.sh' }}
        run: |
          set -euo pipefail
          build=false
          if [ "$EVENT" != push ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            build=true
          else
            read -r -a patterns <<< "$IMAGE_PATHS"
            while IFS= read -r path; do
              for pattern in "${patterns[@]}"; do
                if [[ "$path" == $pattern ]]; then build=true; fi
              done
            done < <(git diff --name-only "$BEFORE" HEAD)
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          image="ghcr.io/${GITHUB_REPOSITORY,,}/devcontainer-ci"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: steps.inputs.outputs.build == 'true'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push devcontainer image
        if: steps.inputs.outputs.build == 'true'
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        env:
          # ⚠ compose の image: / cache_from: と同じ ref を指す。ずれると «焼いた image と
          # 使う image が別» になり、coding-robot 側が作り直す。
          DEVCONTAINER_IMAGE: ${{ steps.inputs.outputs.image }}:latest
        with:
          configFile: .devcontainer/devcontainer.json
          # image ref は小文字に正規化済み。
          imageName: ${{ steps.inputs.outputs.image }}
          imageTag: latest
          push: always
          cacheFrom: |
            ${{ steps.inputs.outputs.image }}:latest
          # ⚠ 焼いた image をここで 1 回使ってみる。壊れた image を :latest として
          # publish すると、次に 🤖 を打った人が run の途中で気づくことになる。
          runCmd: |
            set -e
            for c in git gh jq python3; do
              command -v "$c" >/dev/null || { echo "MISSING: $c"; exit 1; }
            done
            command -v claude >/dev/null || command -v codex >/dev/null || {
              echo "MISSING: neither claude nor codex"; exit 1; }
            if [ -f .github/coding-robot/smoke-local.sh ]; then bash .github/coding-robot/smoke-local.sh; fi
            echo "prebuilt image: toolchain ok"
