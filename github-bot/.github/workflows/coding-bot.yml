name: coding-bot

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]
  # Manual run used to validate the prebuilt-image path (pull → up → exec) from a
  # branch before merge. issue_comment/etc. always run the main-branch workflow
  # definition, so changes to this file can't be exercised via 🤖 until merged.
  # Without issue/pr, verify_only starts a smoke command. With issue or pr, dispatch
  # runs the agent for that issue or continues the existing PR with instruction.
  # CI の受け口が PR 番号を解決してから呼ぶ。github.event は呼び出し元を保持する。
  workflow_call:
    inputs:
      ci_autofix_issue:
        type: string
        default: ''
      ci_autofix_pr:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      verify_only:
        description: "Only verify the prebuilt-image devcontainer path (no agent run)"
        type: boolean
        default: true
      # bot の run が起票した 🤖 issue を、issue の作成と同じに動かす。GITHUB_TOKEN で作った issue は
      # issues: opened を起こさない（GitHub が workflow の連鎖を止める）ので、run の終わりにここから呼ぶ
      issue:
        description: "Run the agent for this issue as if it had just been opened (verify_only is ignored)"
        type: string
        default: ''
      resolve_conflict_pr:
        description: "Resolve only the conflicts of this bot PR in its issue run"
        type: string
        default: ''
      pr:
        description: "Continue an existing bot PR (requires instruction and linked issue)"
        type: string
        default: ''
      instruction:
        description: "Task for the existing PR; overrides the normal ticket implementation flow"
        type: string
        default: ''

      allowed_paths:
        description: "JSON array of task file paths; intersected with default-branch repository policy"
        type: string
        default: ''

# CI の判定から修正まで同じ issue の lock を保持する。PR コメントは push せず別の鍵を使う。
concurrency:
  group: coding-bot-${{ inputs.ci_autofix_issue || inputs.issue || (github.event.issue.pull_request != null && format('pr-{0}', github.event.issue.number)) || (github.event.pull_request != null && format('pr-{0}', github.event.pull_request.number)) || github.event.issue.number || github.run_id }}
  cancel-in-progress: false
  queue: max

# ⚠ 使う action は commit SHA で固定する。tag（@v5 等）は動かせるので、同じ workflow が
# «いつ走ったか» で別のコードを実行しうる。この bot は repo の書き込み権限と engine の
# 認証情報を持って走るので、そこは固定しておく。末尾のコメントが人間向けの版表示。

jobs:
  ci-autofix:
    if: github.event_name == 'workflow_run' && vars.CODING_BOT_CI_AUTOFIX == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      statuses: write
    outputs:
      repair: ${{ steps.decide.outputs.repair }}
      run_id: ${{ steps.decide.outputs.run_id }}
      head_sha: ${{ steps.decide.outputs.head_sha }}
    steps:
      # workflow_run の default branch のコードだけを使う。PR のコードは実行しない。
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Decide CI autofix
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODING_BOT_CI_AUTOFIX: ${{ vars.CODING_BOT_CI_AUTOFIX }}
          CODING_BOT_CI_DRAFT_SKIP_STEP: ${{ vars.CODING_BOT_CI_DRAFT_SKIP_STEP }}
          CI_AUTOFIX_PR: ${{ inputs.ci_autofix_pr }}
        run: bash .github/coding-bot/ci-autofix-decision.sh decide

  agent:
    needs: ci-autofix

    # 🤖 / :robot: だけが起動の合図（issue の作成ではタイトルだけを見る）。bot 自身と marker 付き投稿は除外する。
    # bot の名義の投稿は除外する。ただし変数 CODING_BOT_TRUSTED_BOTS（カンマ区切りの login）に並べた bot は通す
    # （例: 要望を受けて起票する Slack bot。人の依頼を代わりに書いている）。
    # awaiting-reply は状態表示であり、ラベルの有無では起動しない。
    if: |
      always() && !cancelled() && (needs.ci-autofix.outputs.repair == 'true' ||
      github.event_name == 'workflow_dispatch' || (
      (github.event.sender.type != 'Bot' ||
       contains(format(',{0},', vars.CODING_BOT_TRUSTED_BOTS), format(',{0},', github.event.sender.login))) &&
      !contains(github.event.comment.body || '', '<!-- coding-bot -->') &&
      !contains(github.event.review.body || '', '<!-- coding-bot -->') && (
      (github.event_name == 'issue_comment' && (contains(github.event.comment.body, ':robot:') || contains(github.event.comment.body, '🤖'))) ||
      (github.event_name == 'pull_request_review_comment' && (contains(github.event.comment.body, ':robot:') || contains(github.event.comment.body, '🤖'))) ||
      (github.event_name == 'pull_request_review' && (contains(github.event.review.body, ':robot:') || contains(github.event.review.body, '🤖'))) ||
      (github.event_name == 'issues' && !contains(github.event.issue.body || '', '<!-- coding-bot -->') && (contains(github.event.issue.title, ':robot:') || contains(github.event.issue.title, '🤖')))
      )))

    runs-on: ${{ vars.CODING_BOT_RUNNER || 'ubuntu-latest' }}
    env:
      CODING_BOT_COMPOSE_PROJECT: ${{ vars.CODING_BOT_COMPOSE_PROJECT || 'coding-bot' }}
      CODING_BOT_COMPOSE_FILE: ${{ vars.CODING_BOT_COMPOSE_FILE || '.devcontainer/docker-compose.yml' }}
      CODING_BOT_COMPOSE_OVERRIDE: ${{ vars.CODING_BOT_COMPOSE_OVERRIDE || '' }}
      CODING_BOT_WORKSPACE: ${{ vars.CODING_BOT_WORKSPACE || '/workspaces/project' }}
      CODING_BOT_SERVICE: ${{ vars.CODING_BOT_SERVICE || 'app' }}
      CODING_BOT_USER: ${{ vars.CODING_BOT_USER || 'node' }}
      CODING_BOT_POST_CREATE: ${{ vars.CODING_BOT_POST_CREATE || '' }}
      # workflow_dispatch で issue を渡されたら、その issue が作られたときと同じに扱う
      BOT_EVENT: ${{ github.event_name == 'workflow_dispatch' && inputs.pr != '' && 'pull_request' || github.event_name == 'workflow_dispatch' && inputs.issue != '' && 'issues' || github.event_name }}
      BOT_ISSUE: ${{ inputs.ci_autofix_pr || inputs.pr || inputs.issue || github.event.issue.number || github.event.pull_request.number }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      packages: write
      actions: write # bot が最終 SHA の CI を workflow_dispatch で明示起動するために必要

    steps:
      # ステップ1: 即座に 👀 リアクションを追加
      - name: Add eyes reaction to comment
        run: |
          # この run が起票した issue を、終わりに見分けるための時刻
          echo "BOT_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          # イベントタイプに応じてコメントIDとURLを設定
          if [ "$BOT_EVENT" = "issue_comment" ] || [ "$BOT_EVENT" = "pull_request_review_comment" ]; then
            COMMENT_ID="${{ github.event.comment.id }}"
            REACTION_URL="https://api.github.com/repos/${{ github.repository }}/issues/comments/$COMMENT_ID/reactions"
          elif [ "$BOT_EVENT" = "pull_request_review" ]; then
            COMMENT_ID="${{ github.event.review.id }}"
            REACTION_URL="https://api.github.com/repos/${{ github.repository }}/pulls/comments/$COMMENT_ID/reactions"
          elif [ "$BOT_EVENT" = "issues" ]; then
            COMMENT_ID="$BOT_ISSUE"
            REACTION_URL="https://api.github.com/repos/${{ github.repository }}/issues/$COMMENT_ID/reactions"
          fi

          if [ -n "$COMMENT_ID" ]; then
            echo "Adding 👀 reaction (event: $BOT_EVENT, id: $COMMENT_ID)"
            curl -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "$REACTION_URL" \
              -d '{"content":"eyes"}'
          fi

      # ステップ2: コードチェックアウト
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record conflict starting head
        if: inputs.resolve_conflict_pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RESOLVE_CONFLICT_PR: ${{ inputs.resolve_conflict_pr }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/coding-bot-conflict"
          for file in conflict-report.py discussion.py; do
            git show "origin/${{ github.event.repository.default_branch }}:.github/coding-bot/$file" > "$RUNNER_TEMP/coding-bot-conflict/$file"
          done
          python3 -I "$RUNNER_TEMP/coding-bot-conflict/conflict-report.py" start

      - name: Validate dispatch task
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_ISSUE: ${{ inputs.issue }}
          DISPATCH_PR: ${{ inputs.pr }}
          PR_INSTRUCTION: ${{ inputs.instruction }}
          RESOLVE_CONFLICT_PR: ${{ inputs.resolve_conflict_pr }}
          PR_TASK_ALLOWED_PATHS: ${{ inputs.allowed_paths }}
        run: |
          source .github/coding-bot/trigger-source.sh
          validate_dispatch_request "$DISPATCH_ISSUE" "$DISPATCH_PR" "$PR_INSTRUCTION" "$RESOLVE_CONFLICT_PR"
          if [ -n "$DISPATCH_PR" ] && [ -z "$PR_TASK_ALLOWED_PATHS" ]; then
            echo '::error::allowed_paths is required for a PR instruction task (non-empty JSON array of paths)'
            exit 1
          fi
          if [ -n "$DISPATCH_PR" ]; then
            validate_pr_context "$GITHUB_REPOSITORY" "$DISPATCH_PR"
            [ "$TRUSTED_LINKED_ISSUE" = "$DISPATCH_ISSUE" ] || exit 1
          fi

      # ⚠ agent が書き換えられる workspace の script を、秘密付きで実行しない。
      # container に mount されない場所へ、default branch の版を git から直接退避する。
      - name: Preserve devbot notifier on host
        run: |
          if git show "origin/${{ github.event.repository.default_branch }}:.github/coding-bot/notify-devbot.sh" > "$RUNNER_TEMP/notify-devbot.sh"; then
            chmod 0755 "$RUNNER_TEMP/notify-devbot.sh" || echo "Warning: 通知 script を実行可能にできない"
          else
            rm -f "$RUNNER_TEMP/notify-devbot.sh" || true
            echo "Warning: default branch の通知 script を退避できない"
          fi

      # ステップ3: GHCR にログイン（事前ビルド済みイメージの pull 用）
      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ステップ3.5: 事前ビルド済み devcontainer イメージを pull する。
      # Devcontainer Prebuild ワークフロー(.github/workflows/devcontainer-prebuild.yml)
      # が .devcontainer/** 変更時に GHCR へ publish 済み。これを pull して
      # DEVCONTAINER_IMAGE に渡すと、下の compose build が全層キャッシュヒットになり、
      # Dockerfile のインストール処理が再実行されない。
      # 万一 prebuilt が無い場合(初回など)はフォールビルドになるよう pull 失敗は無視する。
      - name: Pull prebuilt devcontainer image
        id: prebuilt
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/devcontainer-ci:latest"
          IMAGE="$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          echo "Pulling prebuilt image: $IMAGE"
          if docker pull "$IMAGE"; then
            echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
            echo "✅ Prebuilt image pulled; compose build will reuse its layers."
          else
            echo "⚠️ Prebuilt image not found; devcontainer will build from scratch this run."
            echo "image=" >> "$GITHUB_OUTPUT"
          fi

      # compose で直接起動する。prebuilt があれば再ビルドしない。
      - name: Start devcontainer services
        env:
          DEVCONTAINER_IMAGE: ${{ steps.prebuilt.outputs.image }}
        run: |
          set -euo pipefail
          compose_args=(-p "$CODING_BOT_COMPOSE_PROJECT" -f "$CODING_BOT_COMPOSE_FILE")
          if [ -n "$CODING_BOT_COMPOSE_OVERRIDE" ] && [ -f "$CODING_BOT_COMPOSE_OVERRIDE" ]; then
            compose_args+=(-f "$CODING_BOT_COMPOSE_OVERRIDE")
          fi
          # 後続の exec でも同じ image ref を使う。
          echo "DEVCONTAINER_IMAGE=$DEVCONTAINER_IMAGE" >> "$GITHUB_ENV"
          if [ -n "${DEVCONTAINER_IMAGE:-}" ]; then
            docker compose "${compose_args[@]}" up -d --no-build
          else
            docker compose "${compose_args[@]}" up -d --build
          fi
          docker compose "${compose_args[@]}" ps
          docker compose "${compose_args[@]}" exec -T -u "$CODING_BOT_USER" "$CODING_BOT_SERVICE" \
            git config --global --add safe.directory "$CODING_BOT_WORKSPACE"
          # checkout は使い捨て。所有者チェックと .git への書き込み権限の両方を整える。
          docker compose "${compose_args[@]}" exec -T -u root "$CODING_BOT_SERVICE" \
            chown -R "$CODING_BOT_USER" "$CODING_BOT_WORKSPACE"

      - name: Run postCreateCommand
        run: |
          set -euo pipefail
          compose_args=(-p "$CODING_BOT_COMPOSE_PROJECT" -f "$CODING_BOT_COMPOSE_FILE")
          if [ -n "$CODING_BOT_COMPOSE_OVERRIDE" ] && [ -f "$CODING_BOT_COMPOSE_OVERRIDE" ]; then
            compose_args+=(-f "$CODING_BOT_COMPOSE_OVERRIDE")
          fi
          # 任意の script path。テンプレートでは追加処理を要求しない。
          if [ -n "$CODING_BOT_POST_CREATE" ]; then
            docker compose "${compose_args[@]}" exec -T -u "$CODING_BOT_USER" \
              -w "$CODING_BOT_WORKSPACE" "$CODING_BOT_SERVICE" \
              bash -c 'if [ -f "$1" ]; then bash "$1"; else echo "postCreate script absent; skipped: $1"; fi' \
              bash "$CODING_BOT_POST_CREATE"
          fi

      # ステップ5: agent（または verify_only の smoke）を container の中で走らせる
      # ⚠ 環境変数は -e で 1 つずつ渡す。file へ書くと secret が container の FS に残る。
      #   中身は .github/coding-bot/run-in-container.sh にある（元は runCmd: の inline）。
      - name: Run Agent
        id: run_claude
        # secret は env から値なしの -e で渡し、shell の引用と command line への露出を避ける。
        env:
          CODING_BOT_ENGINE: ${{ vars.CODING_BOT_ENGINE }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CODING_BOT_CLAUDE_OAUTH_TOKEN }}
          CODING_BOT_CODEX_AUTH_JSON: ${{ secrets.CODING_BOT_CODEX_AUTH_JSON }}
          # Only presence crosses this boundary; SIWC refresh credentials are
          # exclusive to coding-bot-codex-auth.yml.
          CODING_BOT_CODEX_SIWC_PRESENT: ${{ secrets.CODING_BOT_CODEX_SIWC_JSON != '' }}
          CODING_BOT_CODEX_AUTH_MODE: ${{ vars.CODING_BOT_CODEX_AUTH_MODE }}
          CODING_BOT_CODEX_SIWC_KEY: ${{ secrets.CODING_BOT_CODEX_SIWC_KEY }}
          OPENAI_API_KEY: ${{ secrets.CODING_BOT_OPENAI_API_KEY }}
          CODING_BOT_CODEX_MODEL: ${{ vars.CODING_BOT_CODEX_MODEL }}
          CODING_BOT_CLAUDE_MODEL: ${{ vars.CODING_BOT_CLAUDE_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODING_BOT_GH_PAT: ${{ secrets.CODING_BOT_GH_PAT }}
          CODING_BOT_ENV_JSON: ${{ secrets.CODING_BOT_ENV_JSON }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          ISSUE_NUMBER: ${{ env.BOT_ISSUE }}
          CI_AUTOFIX_RUN_ID: ${{ needs.ci-autofix.outputs.run_id }}
          CI_AUTOFIX_HEAD_SHA: ${{ needs.ci-autofix.outputs.head_sha }}
          EVENT_TYPE: ${{ env.BOT_EVENT }}
          PR_INSTRUCTION: ${{ inputs.pr != '' && inputs.instruction || '' }}
          PR_TASK_ISSUE: ${{ inputs.issue }}
          RESOLVE_CONFLICT_PR: ${{ inputs.resolve_conflict_pr }}
          PR_TASK_ALLOWED_PATHS: ${{ inputs.allowed_paths }}
          COMMENT_ID: ${{ github.event.comment.id || github.event.review.id }}
          DEVCONTAINER_CONFIG_PATH: .devcontainer/devcontainer.json
          CODING_BOT_CI_WORKFLOW: ${{ vars.CODING_BOT_CI_WORKFLOW || 'ci.yml' }}
          CODING_BOT_PROGRESS_INTERVAL: ${{ vars.CODING_BOT_PROGRESS_INTERVAL || 60 }}
          CODING_BOT_TIMEOUT: ${{ vars.CODING_BOT_TIMEOUT || 5400 }}
          VERIFY_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.issue == '' && inputs.pr == '' && inputs.verify_only && 'true' || '' }}
        run: |
          set -euo pipefail
          compose_args=(-p "$CODING_BOT_COMPOSE_PROJECT" -f "$CODING_BOT_COMPOSE_FILE")
          if [ -n "$CODING_BOT_COMPOSE_OVERRIDE" ] && [ -f "$CODING_BOT_COMPOSE_OVERRIDE" ]; then
            compose_args+=(-f "$CODING_BOT_COMPOSE_OVERRIDE")
          fi
          docker compose "${compose_args[@]}" \
            exec -T -u "$CODING_BOT_USER" -w "$CODING_BOT_WORKSPACE" \
            -e CODING_BOT_ENGINE \
            -e CODING_BOT_WORKSPACE \
            -e CODING_BOT_CI_WORKFLOW \
            -e CODING_BOT_PROGRESS_INTERVAL \
            -e CLAUDE_CODE_OAUTH_TOKEN \
            -e CODING_BOT_CODEX_AUTH_JSON \
            -e CODING_BOT_CODEX_SIWC_PRESENT \
            -e CODING_BOT_CODEX_AUTH_MODE \
            -e CODING_BOT_CODEX_SIWC_KEY \
            -e OPENAI_API_KEY \
            -e CODING_BOT_CODEX_MODEL \
            -e CODING_BOT_CLAUDE_MODEL \
            -e GITHUB_TOKEN \
            -e GITHUB_ACTIONS \
            -e CODING_BOT_GH_PAT \
            -e CODING_BOT_ENV_JSON \
            -e GITHUB_REPOSITORY \
            -e GITHUB_DEFAULT_BRANCH \
            -e GITHUB_RUN_ID \
            -e ISSUE_NUMBER \
            -e CI_AUTOFIX_RUN_ID \
            -e CI_AUTOFIX_HEAD_SHA \
            -e EVENT_TYPE \
            -e PR_INSTRUCTION \
            -e PR_TASK_ISSUE \
            -e RESOLVE_CONFLICT_PR \
            -e PR_TASK_ALLOWED_PATHS \
            -e COMMENT_ID \
            -e DEVCONTAINER_CONFIG_PATH \
            -e CODING_BOT_TIMEOUT \
            -e VERIFY_ONLY \
            "$CODING_BOT_SERVICE" bash .github/coding-bot/run-in-container.sh

      # エラー時の処理: 👀 を削除して 😟 を追加
      - name: Handle error - Remove eyes and add confused reaction
        if: failure()
        run: |
          # イベントタイプに応じてコメントIDとURLを設定
          if [ "$BOT_EVENT" = "issue_comment" ]; then
            COMMENT_ID="${{ github.event.comment.id }}"
            REACTIONS_URL="https://api.github.com/repos/${{ github.repository }}/issues/comments/$COMMENT_ID/reactions"
            DELETE_URL_PREFIX="https://api.github.com/repos/${{ github.repository }}/issues/comments/$COMMENT_ID/reactions"
          elif [ "$BOT_EVENT" = "pull_request_review_comment" ]; then
            COMMENT_ID="${{ github.event.comment.id }}"
            REACTIONS_URL="https://api.github.com/repos/${{ github.repository }}/pulls/comments/$COMMENT_ID/reactions"
            DELETE_URL_PREFIX="https://api.github.com/repos/${{ github.repository }}/pulls/comments/$COMMENT_ID/reactions"
          elif [ "$BOT_EVENT" = "pull_request_review" ]; then
            COMMENT_ID="${{ github.event.review.id }}"
            REACTIONS_URL="https://api.github.com/repos/${{ github.repository }}/pulls/comments/$COMMENT_ID/reactions"
            DELETE_URL_PREFIX="https://api.github.com/repos/${{ github.repository }}/pulls/comments/$COMMENT_ID/reactions"
          elif [ "$BOT_EVENT" = "issues" ]; then
            COMMENT_ID="$BOT_ISSUE"
            REACTIONS_URL="https://api.github.com/repos/${{ github.repository }}/issues/$COMMENT_ID/reactions"
            DELETE_URL_PREFIX="https://api.github.com/repos/${{ github.repository }}/issues/$COMMENT_ID/reactions"
          fi

          if [ -n "$COMMENT_ID" ]; then
            echo "Handling error (event: $BOT_EVENT, id: $COMMENT_ID)"

            # 既存のリアクションを取得して 👀 を見つける
            REACTIONS=$(curl -s \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "$REACTIONS_URL")

            echo "Reactions response:"
            echo "$REACTIONS" | jq .

            # 👀 (eyes) リアクションのIDを抽出して削除
            echo "$REACTIONS" | jq -r '.[] | select(.content == "eyes") | .id' | while read REACTION_ID; do
              if [ -n "$REACTION_ID" ]; then
                echo "Removing eyes reaction $REACTION_ID from $DELETE_URL_PREFIX/$REACTION_ID"
                curl -X DELETE \
                  -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                  -H "Accept: application/vnd.github.v3+json" \
                  "$DELETE_URL_PREFIX/$REACTION_ID"
              fi
            done

            # 😟 (confused) リアクションを追加
            echo "Adding 😟 reaction"
            curl -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "$REACTIONS_URL" \
              -d '{"content":"confused"}'
          fi

      # workspace の通知ファイルとは別に、イベントと GitHub API から依頼 issue を決める。
      - name: Resolve devbot notification issue
        id: notification_context
        if: always() && inputs.resolve_conflict_pr == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NUMBER: ${{ env.BOT_ISSUE }}
          EVENT_IS_PR: ${{ inputs.pr != '' || github.event_name == 'workflow_run' || github.event.issue.pull_request != null || github.event.pull_request != null }}
        run: |
          set -uo pipefail
          issue=""; pr=""
          if [[ "$EVENT_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            if [ "$EVENT_IS_PR" = true ]; then
              source .github/coding-bot/trigger-source.sh
              if validate_pr_context "$REPO" "$EVENT_NUMBER"; then
                issue="$TRUSTED_LINKED_ISSUE"; pr="$EVENT_NUMBER"
              fi
            else
              issue="$EVENT_NUMBER"

            fi
          fi
          if [ -z "$issue" ]; then
            echo "Warning: 通知先の依頼 issue を確認できない。送信しない"
          fi
          printf 'issue=%s\npr=%s\n' "$issue" "$pr" >> "$GITHUB_OUTPUT"

      # ⚠ run が «何も残さずに» 死ぬのを塞ぐ（F1）。
      #
      # 実測（ある導入先の issue）: run が failure で終わったが、
      # コメントも 👀 も残らなかった。人は 15 分後に勘で 🤖 を打ち直した。
      # ⚠ この壊れ方は定義上 «何も出ない» ので、使っても気づけない。
      #
      # run-action.sh の中に置いても遅い — そこまで到達せずに死ぬ場合があるためである
      # （setup / checkout / devcontainer の起動で落ちると run-action.sh は動いていない）。
      # だから workflow の層に置き、if: always() で必ず通す。
      #
      # ⚠ 二重投稿を避けるため、run-action.sh が最終レポートを投稿したら
      # $GITHUB_WORKSPACE/.coding-bot-reported を置く。この step はそれが在れば何もしない。
      - name: Report conflict resolution
        if: always() && inputs.resolve_conflict_pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RESOLVE_CONFLICT_PR: ${{ inputs.resolve_conflict_pr }}
        run: |
          python3 -I "$RUNNER_TEMP/coding-bot-conflict/conflict-report.py" report

      - name: Report if the run left nothing
        if: always() && inputs.resolve_conflict_pr == ''
        env:
          PR_COMMENT_ONLY: ${{ github.event_name != 'workflow_run' && inputs.pr == '' && (github.event.issue.pull_request != null || github.event.pull_request != null) }}
          PR_INSTRUCTION: ${{ inputs.pr != '' && inputs.instruction || '' }}
          PR: ${{ inputs.pr }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ env.BOT_ISSUE }}
          TRUSTED_ISSUE: ${{ steps.notification_context.outputs.issue }}
          TRUSTED_PR: ${{ steps.notification_context.outputs.pr }}
          EVENT_IS_PR: ${{ inputs.pr != '' || github.event_name == 'workflow_run' || github.event.issue.pull_request != null || github.event.pull_request != null }}
          CONCLUSION: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ -f "$GITHUB_WORKSPACE/.coding-bot-reported" ]; then
            echo "run-action.sh が最終レポートを投稿済み。何もしない"; exit 0
          fi
          if [ "${EVENT_IS_PR:-false}" = true ] && [ -z "${TRUSTED_ISSUE:-}" ]; then
            echo "報告先の issue を確認できません。PR への報告は出さず、実行ログに残します。"
            exit 0
          fi
          if [ "${PR_COMMENT_ONLY:-false}" = true ]; then
            source .github/coding-bot/pr-comment.sh
            TRUSTED_LINKED_ISSUE="$TRUSTED_ISSUE"
            GITHUB_REPOSITORY="$REPO"
            response=$(pr_comment_redirect) || exit 1
            gh issue comment "$TRUSTED_PR" --repo "$REPO" \
              --body "この run では PR の依頼を受け付けられませんでした。[実行ログ]($RUN_URL) $response"
            exit $?
          fi
          if [ -n "${PR_INSTRUCTION:-}" ]; then
            body="指定仕事が結果を残さずに終了（${CONCLUSION}）。[実行ログ]($RUN_URL)"
            echo "$body" | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
            # The runner saves the exact progress ID before starting the agent.
            progress_file="$GITHUB_WORKSPACE/.coding-bot-task-progress"
            progress_id=""
            if [ -f "$progress_file" ]; then progress_id=$(cat "$progress_file"); fi
            if [[ "$progress_id" =~ ^[1-9][0-9]*$ ]]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$progress_id" -f body="$body" || \
                echo 'Could not update task progress; see logs/summary' >&2
            elif [[ "${TRUSTED_ISSUE:-}" =~ ^[1-9][0-9]*$ ]]; then
              gh api "repos/$REPO/issues/$TRUSTED_ISSUE/comments" -f body="$body" || \
                echo 'Could not post task result; see logs/summary' >&2
            fi
            exit 0
          fi
          ISSUE="${TRUSTED_ISSUE:-$ISSUE}"
          if [ -z "${ISSUE:-}" ]; then
            echo "issue 番号が取れない（workflow_dispatch など）。何もしない"; exit 0
          fi
          echo "最終レポートが投稿されていない（job.status=${CONCLUSION}）。1 行残す"
          BODY=$(printf '%s\n\n%s\n\n- %s\n- %s\n\n%s' \
            "**この run は結果を残さずに終わりました**（${CONCLUSION}）。" \
            "実行そのものが途中で落ちたため、何をしたかの報告がありません。作業は進んでいません。" \
            "何が起きたか: [実行ログ]($RUN_URL)" \
            "もう一度やらせるには: このスレッドに 🤖 を付けてコメントしてください" \
            "<!-- coding-bot -->")
          if COMMENT_URL=$(gh issue comment "$ISSUE" --repo "$REPO" --body "$BODY"); then
            # ⚠ fallback が実際に残したコメントへ通知を結び付ける。
            CID="${COMMENT_URL##*#issuecomment-}"
            [[ "$CID" =~ ^[0-9]+$ ]] || CID=""
            if [ -n "$TRUSTED_ISSUE" ]; then
              printf 'issue=%s\nkind=failed\ncomment_id=%s\npr=%s\n' "$TRUSTED_ISSUE" "$CID" "$TRUSTED_PR" \
                > "$GITHUB_WORKSPACE/.coding-bot-notify" || true
            fi
          else
            echo "Warning: failed to post the fallback report"
          fi
          # 閉じた Issue / PR には awaiting-reply を付けない。
          state=$(gh issue view "$ISSUE" --repo "$REPO" --json state -q .state 2>/dev/null || echo UNKNOWN)
          if [ "$state" = "CLOSED" ]; then
            echo "#$ISSUE は閉じている。awaiting-reply は付けない"
          else
            gh issue edit "$ISSUE" --repo "$REPO" --add-label "awaiting-reply" >/dev/null 2>&1 \
              && echo "awaiting-reply を付けた" || echo "Warning: failed to add awaiting-reply"
          fi

      - name: Tell devbot why the run stopped
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.issue != '')
        env:
          TRUSTED_ISSUE: ${{ steps.notification_context.outputs.issue }}
          TRUSTED_PR: ${{ steps.notification_context.outputs.pr }}
          CODING_BOT_NOTIFY_URL: ${{ vars.CODING_BOT_NOTIFY_URL }}
          # 未設定なら送らない（INSTALL.md「任意: 止まったことを外へ知らせる」）
          CODING_BOT_NOTIFY_SECRET: ${{ secrets.CODING_BOT_NOTIFY_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          if [ -z "${CODING_BOT_NOTIFY_URL:-}" ]; then
            echo "devbot URL 未設定。送信しない"; exit 0
          fi
          if [ ! -f "$GITHUB_WORKSPACE/.coding-bot-notify" ]; then
            echo "人を待っていない。送信しない"; exit 0
          fi
          if [ ! -x "$RUNNER_TEMP/notify-devbot.sh" ]; then
            echo "Warning: 退避した通知 script が無い"; exit 0
          fi
          # ⚠ workspace の値は実行しない。既知のキーだけ読み、送信 script が値を検証する。
          issue=""; kind=""; stage=""; comment_id=""; pr=""
          while IFS='=' read -r key value; do
            case "$key" in
              issue) issue="$value" ;;
              kind) kind="$value" ;;
              stage) stage="$value" ;;
              comment_id) comment_id="$value" ;;
              pr) pr="$value" ;;
            esac
          done < "$GITHUB_WORKSPACE/.coding-bot-notify"
          if [ -z "$TRUSTED_ISSUE" ] || [ "$issue" != "$TRUSTED_ISSUE" ]; then
            echo "Warning: 通知ファイルの issue が確認済みの依頼 issue と一致しない。送信しない"
            exit 0
          fi
          # ⚠ PR から起動した run では、pr も event から決まる。ファイルに無ければ補い
          #   （runner の失敗経路は pr を書かない）、違う PR を名乗っていれば送らない。
          if [ -n "${TRUSTED_PR:-}" ]; then
            if [ -z "$pr" ]; then
              pr="$TRUSTED_PR"
            elif [ "$pr" != "$TRUSTED_PR" ]; then
              echo "Warning: 通知ファイルの pr が起動元の PR と一致しない。送信しない"
              exit 0
            fi
          fi
          "$RUNNER_TEMP/notify-devbot.sh" "$issue" "$kind" "$stage" "$comment_id" "$pr" "$RUN_URL" || true
          exit 0

      # ⚠ この run が起票した 🤖 issue を動かす。run の中の起票は GITHUB_TOKEN で行うので、GitHub は
      #   issues: opened から workflow を起こさない（workflow の連鎖を止める決まり）。そのままだと、
      #   🤖 付きでも誰も気づかないまま止まる。workflow_dispatch は GITHUB_TOKEN からでも起動できるので、
      #   issue の番号を渡して、作られたときと同じ作業を始めさせる。
      #   ⚠ 同じ時間に別の run も起票していると、両方の run が同じ issue を見つける。
      #   👀（作業を始めた印）が付いていれば、もう動いているとみなして呼ばない。
      - name: Start runs for 🤖 issues this run opened
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.issue != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          [ -n "${BOT_STARTED_AT:-}" ] || { echo "開始時刻が無い。何もしない"; exit 0; }
          gh issue list --repo "$REPO" --state open --author app/github-actions \
            --search "created:>=$BOT_STARTED_AT" --json number,title,body --limit 20 \
            | jq -r '.[] | select((.title | test("🤖|:robot:")) and ((.body // "") | contains("<!-- coding-bot -->") | not)) | .number' \
            | while read -r n; do
                [ "$n" = "${BOT_ISSUE:-}" ] && continue
                eyes=$(gh api "repos/$REPO/issues/$n/reactions" --jq '[.[] | select(.content == "eyes")] | length' 2>/dev/null || echo 0)
                if [ "${eyes:-0}" != 0 ]; then echo "#$n はもう動いている"; continue; fi
                echo "#$n の作業を始めさせる"
                gh workflow run coding-bot.yml --repo "$REPO" -f issue="$n" -f verify_only=false \
                  || echo "::warning::#$n の coding-bot を起動できませんでした。issue に 🤖 でコメントすると始まります"
              done
          exit 0
