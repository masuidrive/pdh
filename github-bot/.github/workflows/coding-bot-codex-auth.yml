name: Coding Bot Codex Authentication

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      auth_issue_mode:
        description: 'Report authentication failure (siwc or codex-login); blank refreshes logins'
        type: string
        default: ''
      auth_issue_cause:
        description: 'Credential-free authentication failure cause'
        type: string
        default: ''
      auth_issue_kind:
        description: 'auth, stale, or operational (no re-login instructions)'
        type: string
        default: auth

concurrency:
  group: coding-bot-codex-auth
  queue: max

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Install Codex for daily refresh
        id: codex_install
        continue-on-error: true
        if: inputs.auth_issue_mode == ''
        env:
          CODEX_LOGIN_CONFIGURED: ${{ secrets.CODING_BOT_CODEX_AUTH_JSON != '' || vars.CODING_BOT_CODEX_EXTRA_LOGIN_SECRET != '' }}
        run: |
          if [ "$CODEX_LOGIN_CONFIGURED" = true ]; then
            npm install -g @openai/codex
          fi
      - name: Refresh logins or report authentication failure
        env:
          CODING_BOT_CODEX_SIWC_JSON: ${{ secrets.CODING_BOT_CODEX_SIWC_JSON }}
          CODING_BOT_CODEX_SIWC_KEY: ${{ secrets.CODING_BOT_CODEX_SIWC_KEY }}
          CODING_BOT_CODEX_AUTH_JSON: ${{ secrets.CODING_BOT_CODEX_AUTH_JSON }}
          # Optional extra login: the repository variable names its secret.
          CODING_BOT_CODEX_EXTRA_LOGIN_SECRET: ${{ vars.CODING_BOT_CODEX_EXTRA_LOGIN_SECRET }}
          CODING_BOT_CODEX_EXTRA_AUTH_JSON: ${{ vars.CODING_BOT_CODEX_EXTRA_LOGIN_SECRET != '' && secrets[vars.CODING_BOT_CODEX_EXTRA_LOGIN_SECRET] || '' }}
          CODING_BOT_GH_PAT: ${{ secrets.CODING_BOT_GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CODING_BOT_AUTH_ISSUE_MODE: ${{ inputs.auth_issue_mode }}
          CODING_BOT_AUTH_ISSUE_CAUSE: ${{ inputs.auth_issue_cause }}
          CODING_BOT_AUTH_ISSUE_KIND: ${{ inputs.auth_issue_kind || 'auth' }}
          CODING_BOT_CODEX_INSTALL_FAILED: ${{ steps.codex_install.outcome == 'failure' }}
        run: bash .github/coding-bot/codex-refresh.sh
      - name: Report Codex installation failure
        if: steps.codex_install.outcome == 'failure'
        env:
          CODING_BOT_AUTH_ISSUE_MODE: codex-login
          CODING_BOT_AUTH_ISSUE_KIND: operational
          CODING_BOT_AUTH_ISSUE_CAUSE: 'Codex installation failed; daily login refresh could not run'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash .github/coding-bot/codex-refresh.sh
