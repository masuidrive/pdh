name: coding-bot CI autofix

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ['agent/issue-*']

permissions: {}

jobs:
  context:
    if: vars.CODING_BOT_CI_AUTOFIX == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Resolve PR for concurrency
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODING_BOT_CI_AUTOFIX: ${{ vars.CODING_BOT_CI_AUTOFIX }}
        run: bash .github/coding-bot/ci-autofix-decision.sh resolve

  autofix:
    needs: context
    # 判定と agent の両 job が、呼び出し先の coding-bot-<PR> を保持する。
    # PR への人の 🤖 と同じ group。ここにも concurrency を置くと自分を待つ。
    uses: ./.github/workflows/coding-bot.yml
    with:
      ci_autofix_pr: ${{ needs.context.outputs.pr_number }}
    secrets: inherit
    # 再利用先の各 job が必要な権限だけに絞る（呼び出し側はその上限）。
    permissions:
      contents: write
      pull-requests: write
      issues: write
      packages: write
      actions: write
      statuses: write
