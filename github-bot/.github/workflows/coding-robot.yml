name: Coding Robot

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
  # Manual run used to validate the prebuilt-image path (pull → up → exec) from a
  # branch before merge. issue_comment/etc. always run the main-branch workflow
  # definition, so changes to this file can't be exercised via 🤖 until merged.
  # When dispatched, the devcontainer is started against the given issue number but
  # the agent step is a no-op smoke command (see "verify_only").
  workflow_dispatch:
    inputs:
      verify_only:
        description: "Only verify the prebuilt-image devcontainer path (no agent run)"
        type: boolean
        default: true

# ⚠ 同じ issue で 2 つの run を同時に走らせない。走らせると 2 つの agent が同じ
# agent/issue-<N> ブランチへ push を取り合い、進捗コメントを奪い合い、ラベルが往復し、
# CI も二重に起動する。ticket 名は決定的なので
# ticket が二重になることは無いが、commit は競合する。
# cancel-in-progress: false — 走っている方を殺さず、次を待たせる。人の 🤖 コメントは
# «前の作業を捨てて» の意味ではないため。
concurrency:
  group: coding-robot-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

# ⚠ 使う action は commit SHA で固定する。tag（@v5 等）は動かせるので、同じ workflow が
# «いつ走ったか» で別のコードを実行しうる。この bot は repo の書き込み権限と engine の
# 認証情報を持って走るので、そこは固定しておく。末尾のコメントが人間向けの版表示。

jobs:
  agent:
    # 🤖 / :robot: だけが起動の合図。bot 自身と marker 付き投稿は除外する。
    # awaiting-reply は状態表示であり、ラベルの有無では起動しない。
    if: |
      github.event_name == 'workflow_dispatch' || (
      github.event.sender.type != 'Bot' &&
      !contains(github.event.comment.body || '', '<!-- coding-robot -->') &&
      !contains(github.event.review.body || '', '<!-- coding-robot -->') && (
      (github.event_name == 'issue_comment' && (contains(github.event.comment.body, ':robot:') || contains(github.event.comment.body, '🤖'))) ||
      (github.event_name == 'pull_request_review_comment' && (contains(github.event.comment.body, ':robot:') || contains(github.event.comment.body, '🤖'))) ||
      (github.event_name == 'pull_request_review' && (contains(github.event.review.body, ':robot:') || contains(github.event.review.body, '🤖'))) ||
      (github.event_name == 'issues' && !contains(github.event.issue.body || '', '<!-- coding-robot -->') && (contains(github.event.issue.body, ':robot:') || contains(github.event.issue.body, '🤖') || contains(github.event.issue.title, ':robot:') || contains(github.event.issue.title, '🤖')))
      ))

    runs-on: ${{ vars.CODING_ROBOT_RUNNER || 'ubuntu-latest' }}
    env:
      CODING_ROBOT_COMPOSE_PROJECT: ${{ vars.CODING_ROBOT_COMPOSE_PROJECT || 'coding-robot' }}
      CODING_ROBOT_COMPOSE_FILE: ${{ vars.CODING_ROBOT_COMPOSE_FILE || '.devcontainer/docker-compose.yml' }}
      CODING_ROBOT_COMPOSE_OVERRIDE: ${{ vars.CODING_ROBOT_COMPOSE_OVERRIDE || '' }}
      CODING_ROBOT_WORKSPACE: ${{ vars.CODING_ROBOT_WORKSPACE || '/workspaces/project' }}
      CODING_ROBOT_SERVICE: ${{ vars.CODING_ROBOT_SERVICE || 'app' }}
      CODING_ROBOT_USER: ${{ vars.CODING_ROBOT_USER || 'node' }}
      CODING_ROBOT_POST_CREATE: ${{ vars.CODING_ROBOT_POST_CREATE || '' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      packages: write
      actions: write # bot が最終 SHA の CI を workflow_dispatch で明示起動するために必要

    steps:
      # ステップ1: 即座に 👀 リアクションを追加
      - name: Add eyes reaction to comment
        run: |
          # イベントタイプに応じてコメントIDとURLを設定
          if [ "${{ github.event_name }}" = "issue_comment" ] || [ "${{ github.event_name }}" = "pull_request_review_comment" ]; then
            COMMENT_ID="${{ github.event.comment.id }}"
            REACTION_URL="https://api.github.com/repos/${{ github.repository }}/issues/comments/$COMMENT_ID/reactions"
          elif [ "${{ github.event_name }}" = "pull_request_review" ]; then
            COMMENT_ID="${{ github.event.review.id }}"
            REACTION_URL="https://api.github.com/repos/${{ github.repository }}/pulls/comments/$COMMENT_ID/reactions"
          elif [ "${{ github.event_name }}" = "issues" ]; then
            COMMENT_ID="${{ github.event.issue.number }}"
            REACTION_URL="https://api.github.com/repos/${{ github.repository }}/issues/$COMMENT_ID/reactions"
          fi

          if [ -n "$COMMENT_ID" ]; then
            echo "Adding 👀 reaction (event: ${{ github.event_name }}, id: $COMMENT_ID)"
            curl -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "$REACTION_URL" \
              -d '{"content":"eyes"}'
          fi

      # ステップ2: コードチェックアウト
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ステップ3: GHCR にログイン（事前ビルド済みイメージの pull 用）
      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ステップ3.5: 事前ビルド済み devcontainer イメージを pull する。
      # Devcontainer Prebuild ワークフロー(.github/workflows/devcontainer-prebuild.yml)
      # が .devcontainer/** 変更時に GHCR へ publish 済み。これを pull して
      # DEVCONTAINER_IMAGE に渡すと、下の compose build が全層キャッシュヒットになり、
      # Dockerfile のインストール処理が再実行されない。
      # 万一 prebuilt が無い場合(初回など)はフォールビルドになるよう pull 失敗は無視する。
      - name: Pull prebuilt devcontainer image
        id: prebuilt
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/devcontainer-ci:latest"
          IMAGE="$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          echo "Pulling prebuilt image: $IMAGE"
          if docker pull "$IMAGE"; then
            echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
            echo "✅ Prebuilt image pulled; compose build will reuse its layers."
          else
            echo "⚠️ Prebuilt image not found; devcontainer will build from scratch this run."
            echo "image=" >> "$GITHUB_OUTPUT"
          fi

      # compose で直接起動する。prebuilt があれば再ビルドしない。
      - name: Start devcontainer services
        env:
          DEVCONTAINER_IMAGE: ${{ steps.prebuilt.outputs.image }}
        run: |
          set -euo pipefail
          compose_args=(-p "$CODING_ROBOT_COMPOSE_PROJECT" -f "$CODING_ROBOT_COMPOSE_FILE")
          if [ -n "$CODING_ROBOT_COMPOSE_OVERRIDE" ] && [ -f "$CODING_ROBOT_COMPOSE_OVERRIDE" ]; then
            compose_args+=(-f "$CODING_ROBOT_COMPOSE_OVERRIDE")
          fi
          # 後続の exec でも同じ image ref を使う。
          echo "DEVCONTAINER_IMAGE=$DEVCONTAINER_IMAGE" >> "$GITHUB_ENV"
          if [ -n "${DEVCONTAINER_IMAGE:-}" ]; then
            docker compose "${compose_args[@]}" up -d --no-build
          else
            docker compose "${compose_args[@]}" up -d --build
          fi
          docker compose "${compose_args[@]}" ps
          docker compose "${compose_args[@]}" exec -T -u "$CODING_ROBOT_USER" "$CODING_ROBOT_SERVICE" \
            git config --global --add safe.directory "$CODING_ROBOT_WORKSPACE"
          # checkout は使い捨て。所有者チェックと .git への書き込み権限の両方を整える。
          docker compose "${compose_args[@]}" exec -T -u root "$CODING_ROBOT_SERVICE" \
            chown -R "$CODING_ROBOT_USER" "$CODING_ROBOT_WORKSPACE"

      - name: Run postCreateCommand
        run: |
          set -euo pipefail
          compose_args=(-p "$CODING_ROBOT_COMPOSE_PROJECT" -f "$CODING_ROBOT_COMPOSE_FILE")
          if [ -n "$CODING_ROBOT_COMPOSE_OVERRIDE" ] && [ -f "$CODING_ROBOT_COMPOSE_OVERRIDE" ]; then
            compose_args+=(-f "$CODING_ROBOT_COMPOSE_OVERRIDE")
          fi
          # 任意の script path。テンプレートでは追加処理を要求しない。
          if [ -n "$CODING_ROBOT_POST_CREATE" ]; then
            docker compose "${compose_args[@]}" exec -T -u "$CODING_ROBOT_USER" \
              -w "$CODING_ROBOT_WORKSPACE" "$CODING_ROBOT_SERVICE" \
              bash -c 'if [ -f "$1" ]; then bash "$1"; else echo "postCreate script absent; skipped: $1"; fi' \
              bash "$CODING_ROBOT_POST_CREATE"
          fi

      # ステップ5: agent（または verify_only の smoke）を container の中で走らせる
      # ⚠ 環境変数は -e で 1 つずつ渡す。file へ書くと secret が container の FS に残る。
      #   中身は .github/coding-robot/run-in-container.sh にある（元は runCmd: の inline）。
      - name: Run Agent
        id: run_claude
        # secret は env から値なしの -e で渡し、shell の引用と command line への露出を避ける。
        env:
          CODING_ROBOT_ENGINE: ${{ vars.CODING_ROBOT_ENGINE }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_MODEL: ${{ vars.CODEX_MODEL }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATTACHMENTS_TOKEN: ${{ secrets.ATTACHMENTS_TOKEN }}
          HANGAR_TOKEN: ${{ secrets.HANGAR_TOKEN }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          ENV_JSON: ${{ secrets.ENV_JSON }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          EVENT_TYPE: ${{ github.event_name }}
          COMMENT_ID: ${{ github.event.comment.id || github.event.review.id }}
          DEVCONTAINER_CONFIG_PATH: .devcontainer/devcontainer.json
          CODING_ROBOT_CI_WORKFLOW: ${{ vars.CODING_ROBOT_CI_WORKFLOW || 'ci.yml' }}
          PROGRESS_UPDATE_INTERVAL: ${{ vars.CODING_ROBOT_PROGRESS_INTERVAL || 60 }}
          CLAUDE_TIMEOUT: ${{ vars.CODING_ROBOT_TIMEOUT || 5400 }}
          VERIFY_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only && 'true' || '' }}
        run: |
          set -euo pipefail
          compose_args=(-p "$CODING_ROBOT_COMPOSE_PROJECT" -f "$CODING_ROBOT_COMPOSE_FILE")
          if [ -n "$CODING_ROBOT_COMPOSE_OVERRIDE" ] && [ -f "$CODING_ROBOT_COMPOSE_OVERRIDE" ]; then
            compose_args+=(-f "$CODING_ROBOT_COMPOSE_OVERRIDE")
          fi
          docker compose "${compose_args[@]}" \
            exec -T -u "$CODING_ROBOT_USER" -w "$CODING_ROBOT_WORKSPACE" \
            -e CODING_ROBOT_ENGINE \
            -e CODING_ROBOT_WORKSPACE \
            -e CODING_ROBOT_CI_WORKFLOW \
            -e PROGRESS_UPDATE_INTERVAL \
            -e CLAUDE_CODE_OAUTH_TOKEN \
            -e CODEX_AUTH_JSON \
            -e OPENAI_API_KEY \
            -e CODEX_MODEL \
            -e CLAUDE_MODEL \
            -e GITHUB_TOKEN \
            -e ATTACHMENTS_TOKEN \
            -e HANGAR_TOKEN \
            -e FIREBASE_TOKEN \
            -e ENV_JSON \
            -e GITHUB_REPOSITORY \
            -e GITHUB_RUN_ID \
            -e ISSUE_NUMBER \
            -e EVENT_TYPE \
            -e COMMENT_ID \
            -e DEVCONTAINER_CONFIG_PATH \
            -e CLAUDE_TIMEOUT \
            -e VERIFY_ONLY \
            "$CODING_ROBOT_SERVICE" bash .github/coding-robot/run-in-container.sh

      # エラー時の処理: 👀 を削除して 😟 を追加
      - name: Handle error - Remove eyes and add confused reaction
        if: failure()
        run: |
          # イベントタイプに応じてコメントIDとURLを設定
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            COMMENT_ID="${{ github.event.comment.id }}"
            REACTIONS_URL="https://api.github.com/repos/${{ github.repository }}/issues/comments/$COMMENT_ID/reactions"
            DELETE_URL_PREFIX="https://api.github.com/repos/${{ github.repository }}/issues/comments/$COMMENT_ID/reactions"
          elif [ "${{ github.event_name }}" = "pull_request_review_comment" ]; then
            COMMENT_ID="${{ github.event.comment.id }}"
            REACTIONS_URL="https://api.github.com/repos/${{ github.repository }}/pulls/comments/$COMMENT_ID/reactions"
            DELETE_URL_PREFIX="https://api.github.com/repos/${{ github.repository }}/pulls/comments/$COMMENT_ID/reactions"
          elif [ "${{ github.event_name }}" = "pull_request_review" ]; then
            COMMENT_ID="${{ github.event.review.id }}"
            REACTIONS_URL="https://api.github.com/repos/${{ github.repository }}/pulls/comments/$COMMENT_ID/reactions"
            DELETE_URL_PREFIX="https://api.github.com/repos/${{ github.repository }}/pulls/comments/$COMMENT_ID/reactions"
          elif [ "${{ github.event_name }}" = "issues" ]; then
            COMMENT_ID="${{ github.event.issue.number }}"
            REACTIONS_URL="https://api.github.com/repos/${{ github.repository }}/issues/$COMMENT_ID/reactions"
            DELETE_URL_PREFIX="https://api.github.com/repos/${{ github.repository }}/issues/$COMMENT_ID/reactions"
          fi

          if [ -n "$COMMENT_ID" ]; then
            echo "Handling error (event: ${{ github.event_name }}, id: $COMMENT_ID)"

            # 既存のリアクションを取得して 👀 を見つける
            REACTIONS=$(curl -s \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "$REACTIONS_URL")

            echo "Reactions response:"
            echo "$REACTIONS" | jq .

            # 👀 (eyes) リアクションのIDを抽出して削除
            echo "$REACTIONS" | jq -r '.[] | select(.content == "eyes") | .id' | while read REACTION_ID; do
              if [ -n "$REACTION_ID" ]; then
                echo "Removing eyes reaction $REACTION_ID from $DELETE_URL_PREFIX/$REACTION_ID"
                curl -X DELETE \
                  -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                  -H "Accept: application/vnd.github.v3+json" \
                  "$DELETE_URL_PREFIX/$REACTION_ID"
              fi
            done

            # 😟 (confused) リアクションを追加
            echo "Adding 😟 reaction"
            curl -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "$REACTIONS_URL" \
              -d '{"content":"confused"}'
          fi

      # 結果を残さず終わった run に fallback を投稿する。報告済みなら二重投稿しない。
      - name: Report if the run left nothing
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || github.event.pull_request.number }}
          CONCLUSION: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ -z "${ISSUE:-}" ]; then
            echo "issue 番号が取れない（workflow_dispatch など）。何もしない"; exit 0
          fi
          if [ -f "$GITHUB_WORKSPACE/.coding-robot-reported" ]; then
            echo "run-action.sh が最終レポートを投稿済み。何もしない"; exit 0
          fi
          echo "最終レポートが投稿されていない（job.status=$CONCLUSION）。1 行残す"
          BODY=$(printf '%s\n\n%s\n\n- %s\n- %s\n\n%s' \
            "**この run は結果を残さずに終わりました**（$CONCLUSION）。" \
            "実行そのものが途中で落ちたため、何をしたかの報告がありません。作業は進んでいません。" \
            "何が起きたか: [実行ログ]($RUN_URL)" \
            "もう一度やらせるには: このスレッドに 🤖 を付けてコメントしてください" \
            "<!-- coding-robot -->")
          gh issue comment "$ISSUE" --repo "$REPO" --body "$BODY" \
            || echo "Warning: failed to post the fallback report"
          # 閉じた Issue / PR には awaiting-reply を付けない。
          state=$(gh issue view "$ISSUE" --repo "$REPO" --json state -q .state 2>/dev/null || echo UNKNOWN)
          if [ "$state" = "CLOSED" ]; then
            echo "#$ISSUE は閉じている。awaiting-reply は付けない"
          else
            gh issue edit "$ISSUE" --repo "$REPO" --add-label "awaiting-reply" >/dev/null 2>&1 \
              && echo "awaiting-reply を付けた" || echo "Warning: failed to add awaiting-reply"
          fi
