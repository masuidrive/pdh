name: Coding Robot

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# ⚠ 同じ issue で 2 つの run を同時に走らせない。走らせると 2 つの agent が同じ
# agent/issue-<N> ブランチへ push を取り合い、進捗コメントを奪い合い、ラベルが往復する。
# ticket 名は決定的なので ticket が二重になることは無いが、commit は競合する。
# cancel-in-progress: false — 走っている方を殺さず、次を待たせる。人の 🤖 コメントは
# «前の作業を捨てて» の意味ではないため。
concurrency:
  group: coding-robot-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

# ⚠ 使う action は commit SHA で固定する。tag（@v5 等）は動かせるので、同じ workflow が
# «いつ走ったか» で別のコードを実行しうる。この bot は repo の書き込み権限と engine の
# 認証情報を持って走るので、そこは固定しておく。末尾のコメントが人間向けの版表示。

jobs:
  agent:
    # トリガー条件: :robot: または 🤖 を含むコメント・Issue・Pull Request
    # ただし bot 自身のコメントでは起動しない。判定は 2 つある。
    #   1. sender.type != 'Bot' — machinery が GITHUB_TOKEN で投稿する進捗コメントを弾く。
    #   2. ⚠ 本文に `<!-- coding-robot -->` が無いこと — agent 自身が ATTACHMENTS_TOKEN（PAT）で
    #      投稿するコメント（close 判断ボードなど）は author が PAT の持ち主＝人になるので 1 では
    #      弾けない。板の本文には説明として 🤖 が入るため、毎回 run が 1 本空撃ちしていた。
    #      実測 2026-09-17: 3 つの PR すべてで板の投稿から 3 秒後に run が起動し、14〜24 分走って
    #      「追加変更なし」で終わった。印は HTML コメントなので描画されない。
    #      ⚠ 人が板を引用してコメントすると印ごと写り、その依頼は無視される。
    # bot の進捗コメント「🤖 作業中...」が自己再トリガーして二重起動するのを防ぐため。
    # ⚠ awaiting-reply では起動しない（撤回した。合図は 🤖 だけである）。
    #   かつては «待ち印が付いている間は 🤖 が無くても起動する» 枝を 3 本持っていた。理由は
    #   «🤖 の付け忘れで無反応になるのは新しく使う人が最初に踏む罠» だった。だが撤回する。
    #
    #   ⚠ 状態の印と起動の合図を、同じラベルに兼任させてはならない。
    #   awaiting-reply は «誰の番か» を一覧で見せるための印であり、書き手は増え続ける。
    #   導入先で実測した書き手は 4 人 — ①bot が答えを待って止まった（pdh-hooks.sh）
    #   ②run が失敗した（この workflow）③デプロイが失敗した（別 workflow）
    #   ④approve 済み・CI 緑で «あとは merge するだけ» の PR（別 workflow）。
    #   ⚠ 起動の合図を兼ねると、書き手が 1 人増えるたびに 14〜24 分の agent run を起こす道が
    #   1 本増える。しかも書き手の側は «起動する» ことを知らないまま印を付ける。
    #   ④の例では «人が merge を押すだけ» の PR に対して agent が走り出す。
    #
    #   ⚠ そもそも coding-robot の issue に書かれるコメントは bot 宛てのものだけではない。
    #   人同士が会話する。メモを残す。別の bot が書き込む。そのどれもが run を起こしていた。
    #   付け忘れの risk は案内文で受ける（pdh-hooks.sh の «返信には必ず 🤖 を付けてください»）。
    if: |
      github.event.sender.type != 'Bot' &&
      !contains(github.event.comment.body || '', '<!-- coding-robot -->') &&
      !contains(github.event.review.body || '', '<!-- coding-robot -->') && (
      (github.event_name == 'issue_comment' && (contains(github.event.comment.body, ':robot:') || contains(github.event.comment.body, '🤖'))) ||
      (github.event_name == 'pull_request_review_comment' && (contains(github.event.comment.body, ':robot:') || contains(github.event.comment.body, '🤖'))) ||
      (github.event_name == 'pull_request_review' && (contains(github.event.review.body, ':robot:') || contains(github.event.review.body, '🤖'))) ||
      (github.event_name == 'issues' && !contains(github.event.issue.body || '', '<!-- coding-robot -->') && (contains(github.event.issue.body, ':robot:') || contains(github.event.issue.body, '🤖') || contains(github.event.issue.title, ':robot:') || contains(github.event.issue.title, '🤖')))
      )

    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      packages: write
      actions: read

    steps:
      # ステップ1: 即座に 👀 リアクションを追加
      - name: Add eyes reaction to comment
        run: |
          # イベントタイプに応じてコメントIDとURLを設定
          if [ "${{ github.event_name }}" = "issue_comment" ] || [ "${{ github.event_name }}" = "pull_request_review_comment" ]; then
            COMMENT_ID="${{ github.event.comment.id }}"
            REACTION_URL="https://api.github.com/repos/${{ github.repository }}/issues/comments/$COMMENT_ID/reactions"
          elif [ "${{ github.event_name }}" = "pull_request_review" ]; then
            COMMENT_ID="${{ github.event.review.id }}"
            REACTION_URL="https://api.github.com/repos/${{ github.repository }}/pulls/comments/$COMMENT_ID/reactions"
          elif [ "${{ github.event_name }}" = "issues" ]; then
            COMMENT_ID="${{ github.event.issue.number }}"
            REACTION_URL="https://api.github.com/repos/${{ github.repository }}/issues/$COMMENT_ID/reactions"
          fi

          if [ -n "$COMMENT_ID" ]; then
            echo "Adding 👀 reaction (event: ${{ github.event_name }}, id: $COMMENT_ID)"
            curl -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "$REACTION_URL" \
              -d '{"content":"eyes"}'
          fi

      # ステップ2: コードチェックアウト
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ステップ3: GHCR にログイン（イメージキャッシュ用）
      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ステップ4: devcontainer で実行
      # ⚠ 事前ビルド済み image があれば pull して使う（devcontainer-prebuild.yml）。
      # 無ければ従来どおりこの run でビルドする — その workflow は任意なので、
      # 入れていない repo でもここで止まってはいけない。
      - name: Pull prebuilt devcontainer image
        id: prebuilt
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/devcontainer-ci:latest"
          IMAGE="$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          if docker pull "$IMAGE" 2>/dev/null; then
            echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
            echo "✅ prebuilt image pulled; compose build will reuse its layers."
          else
            echo "⚠️ prebuilt image not found; devcontainer will build in this run."
            echo "image=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Agent in devcontainer
        id: run_claude
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        env:
          # docker-compose.yml の image: / cache_from: がこれを読む。空なら compose 側の
          # 既定（ローカル tag）へ落ちて、この run でビルドする。
          DEVCONTAINER_IMAGE: ${{ steps.prebuilt.outputs.image }}
        with:
          configFile: .devcontainer/devcontainer.json
          imageName: ghcr.io/${{ github.repository }}/devcontainer-ci
          # ⚠ push: never — image の publish は devcontainer-prebuild.yml の仕事である。
          # 毎 run push すると、その分（数分）を全 run が払う。
          # ⚠ cacheFrom は置かない — compose 構成では効かない。層の再利用は上で pull した
          # image と docker-compose.yml の cache_from: が担う。
          push: never
          env: |
            CODING_ROBOT_ENGINE=${{ vars.CODING_ROBOT_ENGINE }}
            CLAUDE_CODE_OAUTH_TOKEN=${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
            CODEX_AUTH_JSON=${{ secrets.CODEX_AUTH_JSON }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            CODEX_MODEL=${{ vars.CODEX_MODEL }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
            ATTACHMENTS_TOKEN=${{ secrets.ATTACHMENTS_TOKEN }}
            FIREBASE_TOKEN=${{ secrets.FIREBASE_TOKEN }}
            ENV_JSON=${{ secrets.ENV_JSON }}
            GITHUB_REPOSITORY=${{ github.repository }}
            GITHUB_RUN_ID=${{ github.run_id }}
            ISSUE_NUMBER=${{ github.event.issue.number || github.event.pull_request.number }}
            EVENT_TYPE=${{ github.event_name }}
            COMMENT_ID=${{ github.event.comment.id }}
            DEVCONTAINER_CONFIG_PATH=.devcontainer/devcontainer.json
            CLAUDE_TIMEOUT=${{ vars.CODING_ROBOT_TIMEOUT || 5400 }}
          runCmd: |
            # Run Agent
            ./.github/coding-robot/run-action.sh

      # エラー時の処理: 👀 を削除して 😟 を追加
      - name: Handle error - Remove eyes and add confused reaction
        if: failure()
        run: |
          # イベントタイプに応じてコメントIDとURLを設定
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            COMMENT_ID="${{ github.event.comment.id }}"
            REACTIONS_URL="https://api.github.com/repos/${{ github.repository }}/issues/comments/$COMMENT_ID/reactions"
            DELETE_URL_PREFIX="https://api.github.com/repos/${{ github.repository }}/issues/comments/$COMMENT_ID/reactions"
          elif [ "${{ github.event_name }}" = "pull_request_review_comment" ]; then
            COMMENT_ID="${{ github.event.comment.id }}"
            REACTIONS_URL="https://api.github.com/repos/${{ github.repository }}/pulls/comments/$COMMENT_ID/reactions"
            DELETE_URL_PREFIX="https://api.github.com/repos/${{ github.repository }}/pulls/comments/$COMMENT_ID/reactions"
          elif [ "${{ github.event_name }}" = "pull_request_review" ]; then
            COMMENT_ID="${{ github.event.review.id }}"
            REACTIONS_URL="https://api.github.com/repos/${{ github.repository }}/pulls/comments/$COMMENT_ID/reactions"
            DELETE_URL_PREFIX="https://api.github.com/repos/${{ github.repository }}/pulls/comments/$COMMENT_ID/reactions"
          elif [ "${{ github.event_name }}" = "issues" ]; then
            COMMENT_ID="${{ github.event.issue.number }}"
            REACTIONS_URL="https://api.github.com/repos/${{ github.repository }}/issues/$COMMENT_ID/reactions"
            DELETE_URL_PREFIX="https://api.github.com/repos/${{ github.repository }}/issues/$COMMENT_ID/reactions"
          fi

          if [ -n "$COMMENT_ID" ]; then
            echo "Handling error (event: ${{ github.event_name }}, id: $COMMENT_ID)"

            # 既存のリアクションを取得して 👀 を見つける
            REACTIONS=$(curl -s \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "$REACTIONS_URL")

            echo "Reactions response:"
            echo "$REACTIONS" | jq .

            # 👀 (eyes) リアクションのIDを抽出して削除
            echo "$REACTIONS" | jq -r '.[] | select(.content == "eyes") | .id' | while read REACTION_ID; do
              if [ -n "$REACTION_ID" ]; then
                echo "Removing eyes reaction $REACTION_ID from $DELETE_URL_PREFIX/$REACTION_ID"
                curl -X DELETE \
                  -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                  -H "Accept: application/vnd.github.v3+json" \
                  "$DELETE_URL_PREFIX/$REACTION_ID"
              fi
            done

            # 😟 (confused) リアクションを追加
            echo "Adding 😟 reaction"
            curl -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "$REACTIONS_URL" \
              -d '{"content":"confused"}'
          fi
      # ⚠ run が «何も残さずに» 死ぬのを塞ぐ（F1）。
      #
      # 実測 2026-09-08（ある導入先の issue）: run が failure で終わったが、
      # コメントも 👀 も残らなかった。人は 15 分後に勘で 🤖 を打ち直した。
      # ⚠ この壊れ方は定義上 «何も出ない» ので、使っても気づけない。
      #
      # run-action.sh の中に置いても遅い — そこまで到達せずに死ぬ場合があるためである
      # （setup / checkout / devcontainer の起動で落ちると run-action.sh は動いていない）。
      # だから workflow の層に置き、if: always() で必ず通す。
      #
      # ⚠ 二重投稿を避けるため、run-action.sh が最終レポートを投稿したら
      # $GITHUB_WORKSPACE/.coding-robot-reported を置く。この step はそれが在れば何もしない。
      - name: Report if the run left nothing
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || github.event.pull_request.number }}
          CONCLUSION: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ -z "${ISSUE:-}" ]; then
            echo "issue 番号が取れない（workflow_dispatch など）。何もしない"; exit 0
          fi
          if [ -f "$GITHUB_WORKSPACE/.coding-robot-reported" ]; then
            echo "run-action.sh が最終レポートを投稿済み。何もしない"; exit 0
          fi
          echo "最終レポートが投稿されていない（job.status=$CONCLUSION）。1 行残す"
          BODY=$(printf '%s\n\n%s\n\n- %s\n- %s\n\n%s' \
            "**この run は結果を残さずに終わりました**（$CONCLUSION）。" \
            "実行そのものが途中で落ちたため、何をしたかの報告がありません。作業は進んでいません。" \
            "何が起きたか: [実行ログ]($RUN_URL)" \
            "もう一度やらせるには: このスレッドに 🤖 を付けてコメントしてください" \
            "<!-- coding-robot -->")
          gh issue comment "$ISSUE" --repo "$REPO" --body "$BODY" \
            || echo "Warning: failed to post the fallback report"
          gh issue edit "$ISSUE" --repo "$REPO" --add-label "awaiting-reply" >/dev/null 2>&1 \
            && echo "awaiting-reply を付けた" || echo "Warning: failed to add awaiting-reply"
