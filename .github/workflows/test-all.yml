# Exercise releases and upgrades using the same checks as a local checkout.
name: test-all

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install script test dependencies
        run: python3 -m pip install "PyYAML>=6,<7"
      - name: tools/test-all.sh
        run: bash tools/test-all.sh
