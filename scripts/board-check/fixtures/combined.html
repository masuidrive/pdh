<main class="board" lang="ja" data-board-id="combined-selftest" data-answer-title="最小判断" data-view="document" style="--viewbar:3.2rem">
  <div class="viewswitch">
    <button type="button" data-view-btn="document" class="on" aria-pressed="true">文書</button>
    <button type="button" data-view-btn="deck" aria-pressed="false">スライド</button>
  </div>
  <div class="view-doc">
    <section id="decision">
      <h1><b>最小の判断ボード</b>。</h1>
      <figure class="fig">
        <div class="media"><img src="pixel.svg" alt="検査用の小さな正方形"></div>
        <figcaption>画像が自己完結して表示されることを確かめる。</figcaption>
      </figure>
      <div class="card answer-choice" role="button" tabindex="0" aria-pressed="false"
           data-q="approval" data-value="approve" data-label="承認する">
        <h4>承認する</h4>
        <p>この形で進める。</p>
      </div>
      <section class="answer-set" data-q="approval" data-title="この形で進めるか">
        <textarea class="answer-note" data-q="approval" aria-label="判断の補足"></textarea>
      </section>
    </section>
  </div>
  <div class="view-deck-wrap">
    <div class="deck" id="deck" lang="ja">
      <div class="deck-col">
        <section class="p"><div class="in">
          <h1><b>最小の判断ボード</b>。</h1>
          <div class="card answer-choice" role="button" tabindex="0" aria-pressed="false"
               data-q="approval" data-value="approve" data-label="承認する">
            <h4>承認する</h4>
            <p>この形で進める。</p>
          </div>
        </div></section>
      </div>
    </div>
    <nav class="map" id="map"></nav>
    <div class="edge edge-l"></div><div class="edge edge-r"></div>
    <div class="edge edge-u"></div><div class="edge edge-d"></div>
  </div>
  <aside class="answer-progress" aria-live="polite">
    <span data-progress-count>回答待ち</span><span data-progress-dots aria-hidden="true">○</span>
  </aside>
  <section id="answer-summary">
    <textarea data-answer-output readonly></textarea>
    <button type="button" data-copy-answer>回答をコピー</button>
    <p data-copy-status role="status"></p>
  </section>
</main>
